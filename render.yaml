# One-click deploy on Render (https://render.com): New > Blueprint > this repo.
services:
  - type: web
    name: apollo-crossword
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_LINK_TOKEN
        generateValue: true
